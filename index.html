<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0a10">

<title>Lounge Reme 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: full-screen game. HUD floats over the 3D view: money top-left, chat bar top-centre, buttons top-right, context panel bottom-centre. Single dark luxe look by choice. */
:root{
  --bg:#0d0a10; --glass:rgba(18,12,22,.78); --glass2:rgba(40,28,44,.92); --line:rgba(255,214,140,.28);
  --fg:#fbf6ee; --muted:#cbb9a6; --gold:#f6c45a; --red:#ff5a4f; --green:#3ddc84; --blue:#6cc0ff; --purple:#b46bff;
  --display:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.game{position:fixed;inset:0;overflow:hidden;background:#05040a;touch-action:none;user-select:none;-webkit-user-select:none}
.game canvas{display:block;width:100%;height:100%;cursor:grab}
.game canvas:active{cursor:grabbing}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-weight:600;font-size:13px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#16122a;font-weight:800;font-size:13px;padding:6px 10px;border-radius:12px;max-width:220px;line-height:1.25;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:opacity .2s}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.off,.prompt.off,.float.off{opacity:0}
.lbx i{position:absolute;left:0;right:0;height:0;background:#000;transition:height .45s ease;z-index:4;pointer-events:none}.lbx i:first-child{top:0}.lbx i:last-child{bottom:0}.lbx.on i{height:10vh}
.cinema .hud-tr,.cinema #ctx,.cinema .help,.cinema .chatbar,.cinema .sub,.cinema #joy,.cinema #tJump,.cinema #tAct{opacity:0!important;pointer-events:none!important;transition:opacity .3s}
.vs{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:5;pointer-events:none;display:flex;align-items:center;gap:18px;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .25s}
.vs.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.vs-l,.vs-r{background:linear-gradient(180deg,#2f6fe0,#183a8a);border:3px solid #fff;border-radius:14px;padding:10px 18px;text-align:center;min-width:120px;color:#fff;animation:inl .5s}.vs-r{background:linear-gradient(180deg,#d8432b,#7a1a10);animation:inr .5s}
.vs b{display:block;font:700 clamp(16px,2.6vw,26px) var(--display)}.vs small{display:block;font-weight:800;opacity:.9}
.vs-m{font:700 clamp(30px,6vw,64px) var(--display);color:var(--gold);text-shadow:0 0 18px rgba(255,180,40,.8),0 3px 0 #6a3a00;text-align:center}.vs-m small{font:700 14px var(--body,Nunito);color:#fff;text-shadow:none}
@keyframes inl{from{transform:translateX(-120px);opacity:0}}@keyframes inr{from{transform:translateX(120px);opacity:0}}
.vs-big{font:700 clamp(40px,9vw,96px) var(--display);text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 30px currentColor}.vs-big.win{color:#ffe28a}.vs-big.lose{color:#ff7b72}.vs-big small{font-size:.35em;color:#fff}
.flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}.flashfx.go{animation:flash .5s ease-out}@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.shake{animation:shk .45s}@keyframes shk{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.panel.fxspin{animation:glow .5s ease-in-out infinite alternate}@keyframes glow{from{box-shadow:0 0 0 rgba(246,196,90,0),0 10px 40px rgba(0,0,0,.6)}to{box-shadow:0 0 34px rgba(246,196,90,.85),0 10px 40px rgba(0,0,0,.6)}}
.panel{position:relative}.pflash{position:absolute;inset:0;border-radius:14px;background:radial-gradient(circle,rgba(255,226,138,.75),rgba(255,226,138,0) 70%);pointer-events:none;animation:flash .7s ease-out forwards}
.panel.fxlose{animation:shk .4s}

.shopm{padding:8px;z-index:7}
.shop{width:min(920px,100%);height:min(600px,100%);background:#f4e7cc;border:4px solid #1d4fb8;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;color:#2b2b3a;box-shadow:0 12px 50px rgba(0,0,0,.6)}
.shop-h{background:linear-gradient(180deg,#3a8af0,#1d4fb8);display:flex;align-items:center;gap:8px;padding:7px 10px;color:#fff}
.shop-h .sic{width:38px;height:38px;border-radius:50%;background:#fff3d6;display:grid;place-items:center;font-size:20px;flex:0 0 auto;box-shadow:inset 0 -2px 0 #d9b98a}
.shop-h h3{flex:1;margin:0;font:600 19px var(--display)}
.pill{background:rgba(0,25,80,.4);border-radius:20px;padding:5px 12px;font:700 15px var(--display);white-space:nowrap}
.sx{width:40px;height:40px;border-radius:10px;background:#e2543f;border:2px solid #ffb4a6;color:#fff;font-size:20px;flex:0 0 auto}
.shop-b{flex:1;display:flex;min-height:0;padding:8px;gap:8px}
.side{width:156px;flex:0 0 auto;background:#ead8b2;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:5px;overflow-y:auto}
.side button{position:relative;display:flex;align-items:center;gap:8px;padding:10px;border:0;border-radius:10px;background:transparent;font:600 14px var(--display);color:#3a3020;text-align:left}
.side button.on{background:linear-gradient(180deg,#3a8af0,#1d4fb8);color:#fff;box-shadow:0 3px 0 #123a85}
.side i{font-style:normal;font-size:20px}.side .dot{position:absolute;top:4px;left:4px;width:10px;height:10px;border-radius:50%;background:#e2433a;border:2px solid #fff}
.smain{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.stabs{position:sticky;top:0;z-index:1;display:flex;gap:5px;background:#ead8b2;border-radius:12px;padding:5px;overflow-x:auto;flex:0 0 auto}
.stabs button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;padding:7px 10px;background:transparent;font:600 14px var(--display);color:#3a3020;white-space:nowrap}
.stabs button.on{background:linear-gradient(180deg,#3a8af0,#1d4fb8);color:#fff}.stabs small{background:rgba(0,0,0,.14);border-radius:8px;padding:0 6px;font-size:11px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;padding:2px 2px 10px}
.card{background:#fffaf0;border:2px solid var(--rc);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.card .img{width:100%;height:66px;border-radius:9px;background:radial-gradient(circle at 50% 40%,#2f5fb8,#0f2557);display:grid;place-items:center;font-size:36px;position:relative;margin-bottom:2px}
.tag2{position:absolute;top:4px;right:4px;font:700 10px var(--display);background:#e2433a;color:#fff;border-radius:6px;padding:1px 5px}
.card b{font:600 14px var(--display);line-height:1.15}.card .rr{font-size:12px;font-weight:800;color:var(--rc)}
.shop .chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:2px 0}.shop .chips span{background:#dff3e3;color:#1f7a3a;border-radius:10px;padding:1px 7px;font-size:12px;font-weight:800}
.buy2{margin-top:auto;width:100%;min-height:36px;border:0;border-radius:10px;background:linear-gradient(180deg,#ffd76a,#f0a91c);box-shadow:0 3px 0 #b97a0a;font:700 15px var(--display);color:#4a2a00}
.buy2:disabled{filter:grayscale(.5);opacity:.55}.buy2 s{opacity:.6;font-size:12px;margin-right:4px}
.buy2.eq{background:#e6edf9;box-shadow:0 3px 0 #b7c3dc;color:#1d4fb8}.buy2.on{background:transparent;box-shadow:none;color:#1f9d55;opacity:1;filter:none}.buy2.green{background:linear-gradient(180deg,#3fbf6a,#1f8a45);box-shadow:0 3px 0 #146333;color:#fff}
.sec-t{font:600 14px var(--display);color:#5a4a30;margin:2px 4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding-bottom:10px}
.pk{background:#fffaf0;border:2px solid #e3cc9c;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:8px;text-align:center}
.pk>*:not(h5){margin-left:8px;margin-right:8px}.pk .buy2{width:calc(100% - 16px)}
.pk h5{align-self:stretch;margin:0;background:linear-gradient(90deg,#3a8af0,#1d4fb8);color:#fff;padding:6px 10px;font:600 14px var(--display);text-align:left;clip-path:polygon(0 0,100% 0,93% 100%,0 100%)}
.pk.free{border-color:#3fbf6a}.pk.free h5{background:linear-gradient(90deg,#3fbf6a,#1f8a45)}
.pki{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.pki span{position:relative;width:44px;height:44px;border-radius:10px;background:#f1e3c4;border:2px solid var(--rc,#d8bf8a);display:grid;place-items:center;font-size:24px}.pki span.own{opacity:.45}.pki i{position:absolute;bottom:-6px;right:-6px;background:#2b2b3a;color:#fff;font:700 10px var(--display);font-style:normal;border-radius:6px;padding:0 4px}
.pk small{color:#7a6a50;font-size:12px}.okc{color:#1f9d55}
.pk.pass h5{background:linear-gradient(180deg,#a0582a,#7a3e18);clip-path:none;text-align:center}.pbig2{width:calc(100% - 16px);height:70px;border-radius:10px;background:radial-gradient(circle,#fff1c8,#f7c97a);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px}.pbig2 em{font:700 11px var(--display);font-style:normal;background:#7b3fe4;color:#fff;border-radius:8px;padding:1px 8px}
.pk ul{margin:0;padding:6px 8px 6px 24px;text-align:left;font-size:13px;background:#fff;border-radius:8px;align-self:stretch}
.gbanner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,#3b1f7a,#7a2fc0);color:#fff;border-radius:12px;padding:12px}.gbanner small{display:block;opacity:.85}.gbanner b{font:600 18px var(--display)}.gbtn{display:flex;gap:6px}.gbtn .buy2{width:auto;padding:0 14px}
.gres{display:flex;gap:6px;flex-wrap:wrap}.gr{width:84px;background:#fffaf0;border:2px solid var(--rc);border-radius:10px;padding:6px;text-align:center;animation:pop .35s}.gr span{font-size:28px;display:block}.gr b{font-size:11px;display:block;line-height:1.1}.gr small{font-size:10px;color:var(--rc)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.rates{background:#fffaf0;border-radius:12px;padding:4px 10px}.rate{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #eadcbc;font-size:13px}.rate div{flex:1}.rate small{display:block;font-weight:800}.rate .ri{font-size:22px}
.tashead{display:flex;align-items:center;gap:10px;background:#fffaf0;border-radius:12px;padding:10px}.tashead div{flex:1}.tashead .chips{justify-content:flex-start}.tashead small{color:#7a6a50}.tashead .buy2{width:auto;padding:0 14px;margin:0}
@media (max-width:640px),(max-height:440px){.side{width:76px}.side button{flex-direction:column;gap:1px;padding:6px 2px;font-size:10.5px;text-align:center}.shop-h h3{font-size:16px}.pill.lk{display:none}.sgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}.card .img{height:50px;font-size:28px}.card b{font-size:12.5px}.buy2{font-size:13px;min-height:32px}.shop-b{padding:6px;gap:6px}.stabs button{font-size:12.5px;padding:6px 8px}}

.rescue{display:flex;flex-direction:column;gap:8px}.rescue button{text-align:left;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg)}.rescue button b{display:block;font-size:15px}.rescue button small{color:var(--muted)}.rescue button:disabled{opacity:.45}.rescue .danger{border-color:#ff7b72}
.muted{color:var(--muted);font-size:12.5px;margin:2px 0}
.setb{display:flex;flex-direction:column;gap:10px}.setg{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}.setg h4{margin:0;color:var(--gold);font-family:var(--display)}
.rng{display:flex;align-items:center;gap:10px}.rng span{flex:0 0 110px}.rng input{flex:1;accent-color:var(--gold)}.rng b{width:44px;text-align:right}
.slotr{display:flex;align-items:center;gap:8px}.slotr div{flex:1}.slotr small{display:block;color:var(--muted)}
.setg textarea{width:100%;background:rgba(0,0,0,.35);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px monospace;resize:vertical}
.srow{display:flex;gap:6px;flex-wrap:wrap}.pbtn.danger{background:#7a1f1f;color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.07);border-radius:12px;padding:4px;gap:4px}.seg button{min-height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-family:var(--display);font-weight:700;font-size:15px}.seg button.on.buy{background:var(--green);color:#06281a}.seg button.on.sell{background:var(--red);color:#2a0705}
.tbox{background:rgba(255,255,255,.07);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}.tbox .row{display:flex;justify-content:space-between;font-size:13.5px}
.tin{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:4px 10px}.tin span{color:var(--muted);font-size:12px}.tin input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:700 20px var(--display);text-align:right;outline:none}.tin em{font-style:normal;color:var(--muted);font-size:12px}
.pct{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pct button{min-height:34px;border:0;border-radius:8px;background:rgba(255,255,255,.12);color:var(--fg);font-weight:800}
.tgo{min-height:46px;border:0;border-radius:12px;font-family:var(--display);font-weight:700;font-size:17px}.tgo.buy{background:var(--green);color:#06281a}.tgo.sell{background:var(--red);color:#2a0705}.tmsg{margin:0;font-size:12px;color:var(--muted);text-align:center}
.txr{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.07);font-size:13px}.txr .tq{flex:1}.txr small{display:block;color:var(--muted);font-size:11px}.tg{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px}.tg.buy{background:rgba(61,220,132,.2);color:var(--green)}.tg.sell{background:rgba(255,90,79,.2);color:#ff8a80}
.buffs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.buffs span{background:rgba(61,220,132,.16);color:#8ef0b8;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:800}.buffs.sm span{font-size:11px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.tabs button{flex:0 0 auto;min-height:32px;border:0;border-radius:16px;padding:0 12px;background:rgba(255,255,255,.1);color:var(--fg);font-weight:800;font-size:12.5px}.tabs button.on{background:var(--gold);color:#2a1a00}
.shopi em{font-style:normal;font-size:11px;font-weight:800}.shopi .price{color:var(--gold)}.sbtns{display:flex;flex-direction:column;gap:4px}.shopi button:disabled{opacity:.4}
.rk{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:10px;padding:7px 9px}.rk.me{background:rgba(246,196,90,.18);outline:1px solid var(--gold)}.rk .pos{width:30px;text-align:center;font-weight:800}.rk .nm{flex:1;min-width:0}.rk .nm small{display:block;color:var(--muted);font-size:11px}.rk .w{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}.rk .w i{font-style:normal;font-size:10px;margin-left:3px}.rk button{min-height:30px;border:0;border-radius:8px;padding:0 10px;background:#b7791f;color:#fff;font-weight:800;font-size:12px}
.ttl{font-size:14px;color:var(--muted)}.duel{background:rgba(180,107,255,.15);border:1px solid #b46bff;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}.duel h5{margin:0;color:var(--gold)}
.duelv{display:flex;align-items:center;justify-content:space-around;text-align:center}.duelv b{display:block;font:700 34px var(--display);color:var(--gold)}.duelv i{font-style:normal;font-size:12px;color:var(--muted)}.duelv span{font-weight:800;color:#ff7cc3}
.tag.off{display:none!important}
.debt{color:#ff9a9a}.owned{color:var(--green);font-weight:800}.shopi{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:10px}.shopi .ic{font-size:26px}.shopi div{flex:1}.shopi small{display:block;color:var(--muted)}.shopi button{min-height:38px;border:0;border-radius:10px;padding:0 12px;font-weight:800;background:var(--gold);color:#2a1a00}.shopi button.eq{background:rgba(255,255,255,.15);color:var(--fg)}.score{height:10px;border-radius:5px;background:linear-gradient(90deg,#ff5a4f,#f6c45a,#3ddc84);position:relative;margin:6px 0}.score i{position:absolute;top:-4px;width:4px;height:18px;background:#fff;border-radius:2px}.bk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.bk button{min-height:40px;border:0;border-radius:10px;font-weight:800;background:rgba(255,255,255,.12);color:var(--fg)}.bk button.p{background:var(--gold);color:#2a1a00}
.prompt{position:absolute;transform:translate(-50%,-100%);background:var(--glass);color:#fff;border-radius:8px;padding:5px 10px;font-family:var(--display);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;transition:opacity .15s}
.prompt b{background:#fff;color:#16122a;border-radius:5px;padding:1px 7px}
.float{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-weight:700;font-size:26px;color:#fff;padding:2px 12px;border-radius:10px;border:3px solid #fff;transition:opacity .3s;text-shadow:0 2px 0 rgba(0,0,0,.4)}
/* HUD */
.hud-tl{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;z-index:3}
.money{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 8px}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff1b0,#f6c45a 55%,#b47a12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);display:grid;place-items:center;color:#6a4300;font-family:var(--display);font-weight:700;font-size:13px}
.money b{font-family:var(--display);font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.money.flash b{animation:fl .5s}@keyframes fl{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.sub{background:var(--glass);border-radius:8px;padding:3px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub span{color:var(--fg);font-weight:800}
.sub{display:flex;flex-wrap:wrap;gap:2px 10px;max-width:calc(100vw - 300px)}.sub>i{font-style:normal;white-space:nowrap}.sub .lb{font-weight:600;color:var(--muted)}.sub em{display:none;font-style:normal}
.chatbar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(190px,calc(50% - 280px));right:max(270px,calc(50% - 280px));display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 12px;z-index:3;text-align:left}
.chatbar #chatLast{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.chatbar .hint{font-size:12px;color:var(--gold);font-weight:800;white-space:nowrap}
.hud-tr{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:6px;z-index:3}
.hud-tr button{width:42px;height:42px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
.hud-tr button[aria-pressed="false"]{opacity:.5}

function nearestWheel(){
  if(!you)return null;let best=null,bd=1e9;
  for(const w of wheels){const dx=w.use.x-you.pos.x,dz=w.use.z-you.pos.z,dd=Math.hypot(dx,dz),dy=Math.abs(you.pos.y-w.y);
    const dc=Math.hypot(w.x-you.pos.x,w.z-you.pos.z);
    if((dd<2.2||dc<2.4)&&dy<1.2&&dd<bd){bd=dd;best=w;}}
  return best;
}
async function interact(){
  if(!started||modal)return;audio();
  const st=stationPick();if(st){if(st.type==='garage'){openShop('prop');return;}openGame(st);return;}
  const w=nearestWheel();
  if(w&&w.role==='duelP'){if(!busy)duelAtTable();return;}
  if(w&&w.role==='duelR'){speak(DUEL.hostEnt,'Itu roda lawan. Kamu pakai roda KAMU di sebelah sana.');SFX.error();return;}
  if(!w){speak(you,'Belum ada roda di dekatku.',false);SFX.error();return;}
  if(w.role==='host'){speak(w.table.hostEnt,`Itu roda saya, bos! Pakai roda ${w.table.KIND} di depan meja.`);SFX.error();return;}
  if(w.spin)return;
  you.yaw=Math.atan2(w.x-you.pos.x,w.z-you.pos.z);camGoal=w.ry+(w.role==='player'?.5:.35);
  if(w.role==='player'){remeRound(w.table);return;}
  you.arm=1.2;
  const n=rnd();shotWheel(w,4.4,1.2);SFX.whoosh();SFX.drum(2.3);
  await spinWheel(w,n,2400);
  SFX.stop(volFor(w.center));showFloat(w,n);flashFx();if(reme(n)===0)shakeFx();setTimeout(()=>{if(!stage.classList.contains('cinema')&&cine){cine=null;cineBlend=1;}},1100);
  speak(you,`Dapat ${n}! Reme ${reme(n)}.`,false);
  logLine('sys',null,`Kamu memutar roda ${w.label.toLowerCase()} dan dapat ${n}. Reme ${reme(n)}.`);
  if(reme(n)===0){burst(w.center,25);SFX.coin();}
}

function buildHostTables(){

    // table along z, host behind it (east), player in front (west)
    solidBox(1.8,1,6,mat(0x5a3518),TX,z);box(2,.12,6.2,mat(0xffc83d),TX,1.04,z,false);box(1.6,.06,5.8,mat(t.vip?0x7a1530:0x1f8a4c),TX,1.12,z,false);
    solidBox(2,.3,4,mat(0x3a2050),TX+2.2,z);

    if(t.vip){rope(TX-4.8,z-4.6,TX-4.8,z-1.2);rope(TX-4.8,z+4.6,TX-4.8,z+3.9);}

function rope(x1,z1,x2,z2){
  const g=mat(0xd8a648),r=mat(0x9e1f33);
  [[x1,z1],[x2,z2]].forEach(([x,z])=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,1,10),g);p.position.set(x,.5,z);p.castShadow=true;scene.add(p);
    const b=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),g);b.position.set(x,1.05,z);scene.add(b);
    const base=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.05,12),g);base.position.set(x,.03,z);scene.add(base);});
  const L=Math.hypot(x2-x1,z2-z1),c=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,L,8),r);
  c.position.set((x1+x2)/2,.85,(z1+z2)/2);c.rotation.z=Math.PI/2;c.rotation.y=-Math.atan2(z2-z1,x2-x1);scene.add(c);
  colliders.push({x0:Math.min(x1,x2)-.15,x1:Math.max(x1,x2)+.15,z0:Math.min(z1,z2)-.15,z1:Math.max(z1,z2)+.15,top:1.1});
}
async function remeRound(t){
  if(busy)return;
  const H=t.hostEnt,w=t.pw,hw=t.hw;
  if(S.bet<=0){speak(H,'Pasang chip dulu di panel bawah, baru putar.');return;}
  if(S.bet<t.min){speak(H,`Meja ini minimal ${fmt(t.min)} koin, bos.`);SFX.error();return;}
  busy=true;render();cineOn();SFX.whoosh();
  const bet=S.bet,K=t.KIND,V=t.val;
  shotTo(ROOM-14,4.6,t.z,ROOM-6,1.6,t.z);banner(`<div class="vs-l"><b>KAMU</b><small>🪙 ${fmt(S.bet)}</small></div><div class="vs-m">${t.KIND}<small>${t.name}</small></div><div class="vs-r"><b>${t.host}</b><small>Host</small></div>`,'duelb',1900);
  speak(you,`Bet ${fmt(bet)} koin!`);
  await wait(700);
  speak(H,`Bet ${fmt(bet)} diterima. Kamu putar duluan.`);
  await wait(900);
  you.arm=1.4;shotWheel(w);SFX.drum(3.2);
  let pn=rnd();{const sc=n=>{const v=V(n);return v===t.sp?99:v;};if(luckTry(sc(pn)<5)){const p2=rnd();if(sc(p2)>sc(pn))pn=p2;}}
  await spinWheel(w,pn,3200);
  SFX.stop();showFloat(w,pn,5000);flashFx();
  const pr=V(pn);showResult(`KAMU: ${numSpan(pn)} → ${K} ${pr}`);
  logLine('sys',null,`Kamu memutar roda dan dapat ${pn}. ${K} ${pr}.`);
  let outcome,hr=null;
  await wait(900);
  if(pr===t.sp)outcome='big';
  else{
    speak(H,(t.kind==='reme'?pr>=8:pr>=7&&pr!==9)?`Wih, ${pr}. Bahaya nih...`:`${K} ${pr}. Giliran saya.`);
    await wait(1000);
    H.yaw=Math.atan2(hw.x-H.pos.x,hw.z-H.pos.z);H.arm=1.4;shotWheel(hw);SFX.drum(3.2);
    const hn=rnd();await spinWheel(hw,hn,3200);
    H.yaw=-Math.PI/2;
    SFX.stop();showFloat(hw,hn,5000);hr=V(hn);flashFx();
    showResult(`HOST: ${numSpan(hn)} → ${K} ${hr}`);
    logLine('sys',null,`${t.host} memutar roda dan dapat ${hn}. ${K} ${hr}.`);
    await wait(800);
    const rank=v=>t.kind==='reme'?v:v; // higher value wins in both games
    if(hr===t.sp)outcome='hostzero';else if(rank(pr)>rank(hr))outcome='win';else if(rank(pr)<rank(hr))outcome='lose';else outcome=tieHost?'tielose':'push';
  }
  S.bet=0;betTable=null;shotEnt(you);
  if(outcome==='big'||outcome==='win'){flashFx('#ffe28a');banner(`<div class="vs-big win">${outcome==='big'?K+' '+t.sp+'!':'MENANG!'}<small>+🪙 ${fmt(outcome==='big'?bet*t.big:bet*2)}</small></div>`,'resb',2000);if(outcome==='big')shakeFx();}
  else if(outcome!=='push')banner(`<div class="vs-big lose">KALAH<small>-🪙 ${fmt(bet)}</small></div>`,'resb',1800);
  if(outcome==='big'){
    const pay=bet*t.big+bonusOn(bet*(t.big-1));S.bal+=pay;S.wins++;you.cheer=2.5;
    showResult(`${K} ${t.sp}! MENANG ${t.big}X`);SFX.big();burst(new THREE.Vector3(you.pos.x,you.pos.y+3,you.pos.z),90);burst(w.center,40);
    speak(H,`${K} ${t.sp}! Selamat, kamu dapat ${fmt(pay)} koin!`);logLine('sys',null,`${t.name}: kamu menang ${fmt(pay)} koin (${t.big}x).`,'win');
    crowdCheer(you.pos);
  }else if(outcome==='win'){
    const pay=bet*2+bonusOn(bet);S.bal+=pay;S.wins++;you.cheer=1.6;SFX.win();burst(new THREE.Vector3(you.pos.x,you.pos.y+3,you.pos.z),45);
    speak(H,`${K} ${pr} lawan ${hr}. Kamu menang ${fmt(pay)}!`);logLine('sys',null,`${t.name}: kamu menang ${fmt(pay)} koin (2x).`,'win');
  }else if(outcome==='push'){
    S.bal+=bet;SFX.coin();speak(H,`Seri ${pr} lawan ${hr}. Taruhan kembali.`);logLine('sys',null,`Seri. ${fmt(bet)} koin dikembalikan.`);
  }else{
    S.losses++;H.cheer=1.2;SFX.lose();
    const why=outcome==='hostzero'?`Host dapat ${K} ${t.sp}!`:outcome==='tielose'?`Seri ${pr} lawan ${hr}, host menang.`:`${K} ${pr} lawan ${hr}.`;
    speak(H,`${why} Coba lagi, bos.`);logLine('sys',null,`${t.name}: kamu kalah ${fmt(bet)} koin.`,'lose');
  }
  S.hist.push({k:t.kind==='reme'?'R':'Q',p:pr,h:hr===null?'-':hr,w:outcome==='big'||outcome==='win'});if(S.hist.length>40)S.hist=S.hist.slice(-40);
  save();
  await wait(1600);cineOff();
  setTimeout(checkBroke,50);
  busy=false;render();
}

async function runDuel(stake){
  const rv=PF.rivals.find(r=>r.n===duel.n);if(!rv||S.bal<stake){SFX.error();return;}
  S.bal-=stake;duel.stake=stake;duel.stage='roll';duel.y=null;duel.o=null;duel.msg='Memutar...';render();phoneRender();
  const npcE=ents.find(e=>e.name===rv.n);
  let y,o;
  do{y=rnd();if(luckTry(duelVal(y)<5)){const y2=rnd();if(duelVal(y2)>duelVal(y))y=y2;}o=rnd();
    for(let k=0;k<16;k++){const a=$('dY'),b=$('dO');if(a)a.textContent=pick(37);if(b)b.textContent=pick(37);SFX.tick(.5,.4);await wait(70);}
    if(duelVal(y)===duelVal(o)){const m=$('dMsg');if(m)m.textContent=`Seri reme ${reme(y)}! Putar ulang...`;const a=$('dY'),b=$('dO');if(a)a.textContent=y;if(b)b.textContent=o;await wait(900);}
  }while(duelVal(y)===duelVal(o));
  duel.y=y;duel.o=o;duel.stage='done';
  if(duelVal(y)>duelVal(o)){const bo=bonusOn(stake);S.bal+=stake*2+bo;rv.w=Math.max(100,rv.w-stake);S.wins++;duel.msg=`Kamu menang! +${fmt(stake+bo)} koin`;SFX.win();you.cheer=1.5;
    logLine('sys',null,`Duel: kamu mengalahkan ${rv.n} (reme ${reme(y)} lawan ${reme(o)}). +${fmt(stake+bo)} koin.`,'win');if(npcE)speak(npcE,'Wah, kalah aku. Lain kali balas!',false);}
  else{rv.w+=stake;S.losses++;duel.msg=`${rv.n} menang. -${fmt(stake)} koin`;SFX.lose();
    logLine('sys',null,`Duel: kamu kalah dari ${rv.n} (reme ${reme(y)} lawan ${reme(o)}). -${fmt(stake)} koin.`,'lose');if(npcE){npcE.cheer=1.2;speak(npcE,'Hahaha, hoki lagi berpihak ke aku!',false);}}
  save();savePF();render();phoneRender();setTimeout(checkBroke,50);
}

function spark(cv,h,col){const g=cv.getContext('2d'),w=cv.width,hh=cv.height;g.clearRect(0,0,w,hh);const mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1;
  g.beginPath();h.forEach((p,i)=>{const x=i/(h.length-1)*w,y=hh-3-(p-mn)/r*(hh-6);i?g.lineTo(x,y):g.moveTo(x,y);});g.strokeStyle=col;g.lineWidth=2;g.stroke();
  g.lineTo(w,hh);g.lineTo(0,hh);g.closePath();g.fillStyle=col+'33';g.fill();}

  function controls(){
    ctrl.innerHTML='';
    if(state==='bet'){ctrl.appendChild(chipPicker([10,50,100,500],bet,v=>bet=v));const b=document.createElement('button');b.className='pbig';b.textContent='BAGI KARTU';b.onclick=deal;ctrl.appendChild(b);}
    else if(state==='play'){const row=document.createElement('div');row.className='prow';
      [['Hit',hit],['Stand',stand],['Double',dbl]].forEach(([t,f])=>{const b=document.createElement('button');b.className='pbtn';b.textContent=t;b.onclick=f;if(t==='Double'&&(ph.length>2||S.bal<stake))b.disabled=true;row.appendChild(b);});ctrl.appendChild(row);}
  }
  async function deal(){
    if(!takeBet(bet)){msg.textContent='Saldo tidak cukup.';return;}
    stake=bet;modal.busy=true;modal.refresh();ph=[];dh=[];state='deal';controls();msg.textContent='Membagi kartu...';
    for(const who of ['p','d','p','d']){(who==='p'?ph:dh).push(drawCard());draw(true);SFX.card();await wait(320);}
    if(handVal(ph)===21){await finish(true);return;}
    state='play';msg.textContent='Hit untuk tambah kartu, Stand untuk berhenti.';controls();
  }
  async function hit(){if(state!=='play')return;ph.push(drawCard());SFX.card();draw(true);if(handVal(ph)>21){state='end';await finish();}else if(handVal(ph)===21){await stand();}else controls();}
  async function dbl(){if(state!=='play'||!takeBet(stake))return;stake*=2;modal.refresh();ph.push(drawCard());SFX.card();draw(true);await wait(300);if(handVal(ph)>21){state='end';await finish();}else await stand();}
  async function stand(){if(state!=='play')return;state='dealer';controls();draw(false);SFX.card();await wait(500);
    while(handVal(dh)<17&&handVal(ph)<=21){dh.push(drawCard());SFX.card();draw(false);await wait(500);}await finish();}
  async function finish(natural){
    draw(false);const p=handVal(ph),d=handVal(dh);let ret=0,txt;
    const pBJ=natural&&ph.length===2,dBJ=dh.length===2&&d===21;
    if(pBJ&&!dBJ){ret=Math.floor(stake*2.5);txt=`BLACKJACK! Dibayar 3:2, dapat ${fmt(ret)}.`;SFX.big();you.cheer=2;}
    else if(p>21){txt=`Bust (${p}). Kamu kalah.`;SFX.lose();}
    else if(d>21){ret=stake*2;txt=`Dealer bust (${d}). Kamu menang!`;SFX.win();you.cheer=1.2;}
    else if(p>d){ret=stake*2;txt=`${p} lawan ${d}. Kamu menang!`;SFX.win();you.cheer=1.2;}
    else if(p<d){txt=`${p} lawan ${d}. Dealer menang.`;SFX.lose();}
    else{ret=stake;txt=`Seri ${p}. Taruhan kembali.`;SFX.coin();}
    msg.innerHTML=`<b class="${ret>stake?'win':ret<stake?'lose':''}">${txt}</b>`;
    speak(dealer,ret>stake?'Selamat, kartunya bagus!':ret<stake?'Rumah menang kali ini.':'Seri, coba lagi.',false);
    settle(stake,ret,'Blackjack');modal.refresh();state='bet';modal.busy=false;controls();
  }
  draw(true);controls();
}

/* ---------- roulette ---------- */
const RBETS={red:{t:'Merah',p:1,f:n=>RED.has(n)},black:{t:'Hitam',p:1,f:n=>n>0&&!RED.has(n)},odd:{t:'Ganjil',p:1,f:n=>n>0&&n%2===1},even:{t:'Genap',p:1,f:n=>n>0&&n%2===0},
  low:{t:'1-18',p:1,f:n=>n>=1&&n<=18},high:{t:'19-36',p:1,f:n=>n>=19},d1:{t:'1-12',p:2,f:n=>n>=1&&n<=12},d2:{t:'13-24',p:2,f:n=>n>=13&&n<=24},d3:{t:'25-36',p:2,f:n=>n>=25}};
function rouletteGame(body,st){
  let chip=10,bets={},rot=0;const crou=st.dealer;const rouletteDisc=st.disc;
  body.innerHTML=`<div class="rtop"><canvas class="rwheel" width="220" height="220"></canvas><div><p class="pmsg">Klik papan untuk pasang chip.</p><p class="rlast"></p></div></div><div class="rboardwrap"><div class="rboard"></div></div><div class="routs"></div><div class="pctrl"></div>`;
  const cv=body.querySelector('.rwheel'),g=cv.getContext('2d'),msg=body.querySelector('.pmsg'),board=body.querySelector('.rboard'),outs=body.querySelector('.routs'),ctrl=body.querySelector('.pctrl');
  function drawW(){const cx=110,cy=110,R=104;g.clearRect(0,0,220,220);g.fillStyle='#ffc83d';g.beginPath();g.arc(cx,cy,R+5,0,Math.PI*2);g.fill();
    for(let i=0;i<37;i++){const a0=rot+i*SEG-Math.PI/2;g.fillStyle=colorOf(ORDER[i]);g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a0,a0+SEG+.01);g.closePath();g.fill();
      g.save();g.translate(cx,cy);g.rotate(a0+SEG/2);g.fillStyle='#fff';g.font='700 10px Fredoka';g.textAlign='center';g.fillText(ORDER[i],R-12,4);g.restore();}
    g.fillStyle='#3a2410';g.beginPath();g.arc(cx,cy,R*.62,0,Math.PI*2);g.fill();g.fillStyle='#d79a16';g.beginPath();g.arc(cx,cy,R*.5,0,Math.PI*2);g.fill();
    g.fillStyle='#fff';g.beginPath();g.moveTo(cx-8,2);g.lineTo(cx+8,2);g.lineTo(cx,18);g.closePath();g.fill();}
  const cells={};
  const addCell=(parent,key,label,cls)=>{const b=document.createElement('button');b.className='rcell '+(cls||'');b.innerHTML=`<span>${label}</span><i></i>`;b.onclick=()=>{if(modal.busy)return;if(!takeBet(chip)){msg.textContent='Saldo tidak cukup.';return;}bets[key]=(bets[key]||0)+chip;SFX.chip();upd();modal.refresh();};parent.appendChild(b);cells[key]=b;};
  addCell(board,'n0','0','g zero');
  for(let r=2;r>=0;r--)for(let c=0;c<12;c++){const n=c*3+r+1;addCell(board,'n'+n,n,RED.has(n)?'r':'k');}
  Object.keys(RBETS).forEach(k=>addCell(outs,k,RBETS[k].t,k==='red'?'r':k==='black'?'k':''));
  function upd(){let tot=0;for(const k in cells){const v=bets[k]||0;tot+=v;cells[k].querySelector('i').textContent=v?fmt(v):'';cells[k].classList.toggle('has',!!v);}btnSpin.disabled=!tot||modal.busy;btnClr.disabled=!tot||modal.busy;total.textContent=`Total taruhan: ${fmt(tot)}`;return tot;}
  ctrl.appendChild(chipPicker([10,50,100,500],chip,v=>chip=v));
  const total=document.createElement('p');total.className='rtot';ctrl.appendChild(total);
  const row=document.createElement('div');row.className='prow';ctrl.appendChild(row);
  const btnClr=document.createElement('button');btnClr.className='pbtn';btnClr.textContent='Hapus';row.appendChild(btnClr);
  const btnSpin=document.createElement('button');btnSpin.className='pbig';btnSpin.textContent='PUTAR';row.appendChild(btnSpin);
  btnClr.onclick=()=>{let t=0;for(const k in bets)t+=bets[k];S.bal+=t;bets={};upd();render();modal.refresh();SFX.chip();};
  btnSpin.onclick=async()=>{
    const stake=upd();if(!stake||modal.busy)return;modal.busy=true;upd();modalFx('spin');
    speak(crou,'Tidak ada taruhan lagi!',false);msg.textContent='Bola berputar...';
    const rr=x=>{let r=0;for(const k in bets){const v=bets[k];if(k[0]==='n'){if(+k.slice(1)===x)r+=v*36;}else if(RBETS[k].f(x))r+=v*(RBETS[k].p+1);}return r;};let n=rnd();if(luckTry(rr(n)<stake))n=rnd();const i=ORDER.indexOf(n);let target=-(i+.5)*SEG+(Math.random()-.5)*SEG*.5;const from=rot;target+=Math.ceil((from+Math.PI*2*5-target)/(Math.PI*2))*Math.PI*2;
    const d3from=rouletteDisc.rotation.z,t0=performance.now(),dur=4000;let lastSeg=null;SFX.spinStart();
    await new Promise(res=>{function f(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);rot=from+(target-from)*e;drawW();rouletteDisc.rotation.z=d3from+(target-from)*e;
      const sg=Math.floor(rot/SEG);if(sg!==lastSeg){if(lastSeg!==null)SFX.tick(1-k,.8);lastSeg=sg;}if(k<1)requestAnimationFrame(f);else res();}requestAnimationFrame(f);});
    SFX.stop();
    let ret=0;for(const k in bets){const v=bets[k];if(k[0]==='n'){if(+k.slice(1)===n)ret+=v*36;}else if(RBETS[k].f(n))ret+=v*(RBETS[k].p+1);}
    const col=n===0?'hijau':RED.has(n)?'merah':'hitam';
    body.querySelector('.rlast').innerHTML=`Hasil: <b class="rnum" style="background:${colorOf(n)}">${n}</b> ${col}`;
    msg.innerHTML=ret>0?`<b class="win">Menang ${fmt(ret)} koin!</b>`:`<b class="lose">Tidak kena kali ini.</b>`;
    if(ret>stake){ret>=stake*10?SFX.big():SFX.win();you.cheer=1.4;}else SFX.lose();
    speak(crou,`${n} ${col}!`,false);
    settle(stake,ret,'Roulette');bets={};modal.busy=false;upd();modal.refresh();
  };
  drawW();upd();
}

/* ---------- dice (besar kecil) ---------- */
const DBETS={small:{t:'Kecil 4-10',p:1},big:{t:'Besar 11-17',p:1},odd:{t:'Ganjil',p:1},even:{t:'Genap',p:1},triple:{t:'Triple apa saja',p:30}};
const pipHTML=v=>`<div class="die d${v}">${'<i></i>'.repeat(v)}</div>`;
function diceGame(body,st){
  let chip=10,bets={};const joko=st.dealer;
  body.innerHTML=`<div class="dice"></div><p class="pmsg">Pasang chip, lalu kocok.</p><div class="dbets"></div><div class="pctrl"></div>`;
  const dice=body.querySelector('.dice'),msg=body.querySelector('.pmsg'),db=body.querySelector('.dbets'),ctrl=body.querySelector('.pctrl');
  dice.innerHTML=pipHTML(1)+pipHTML(2)+pipHTML(3);
  const cells={};
  Object.keys(DBETS).forEach(k=>{const b=document.createElement('button');b.className='rcell dcell';b.innerHTML=`<span>${DBETS[k].t}</span><small>${DBETS[k].p}:1</small><i></i>`;
    b.onclick=()=>{if(modal.busy)return;if(!takeBet(chip)){msg.textContent='Saldo tidak cukup.';return;}bets[k]=(bets[k]||0)+chip;SFX.chip();upd();modal.refresh();};db.appendChild(b);cells[k]=b;});
  ctrl.appendChild(chipPicker([10,50,100,500],chip,v=>chip=v));
  const row=document.createElement('div');row.className='prow';ctrl.appendChild(row);
  const clr=document.createElement('button');clr.className='pbtn';clr.textContent='Hapus';row.appendChild(clr);
  const go=document.createElement('button');go.className='pbig';go.textContent='KOCOK DADU';row.appendChild(go);
  function upd(){let t=0;for(const k in cells){const v=bets[k]||0;t+=v;cells[k].querySelector('i').textContent=v?fmt(v):'';cells[k].classList.toggle('has',!!v);}go.disabled=!t||modal.busy;clr.disabled=!t||modal.busy;return t;}
  clr.onclick=()=>{let t=0;for(const k in bets)t+=bets[k];S.bal+=t;bets={};upd();render();modal.refresh();SFX.chip();};
  go.onclick=async()=>{
    const stake=upd();if(!stake||modal.busy)return;modal.busy=true;upd();msg.textContent='Mengocok...';SFX.shake();modalFx('spin');
    const roll3=()=>[1+pick(6),1+pick(6),1+pick(6)];const dr=r=>{const sm=r[0]+r[1]+r[2],tr=r[0]===r[1]&&r[1]===r[2];let x=0;for(const k in bets){const v=bets[k];let hit=false;if(k==='triple')hit=tr;else if(!tr){hit=k==='small'?sm<=10:k==='big'?sm>=11:k==='odd'?sm%2===1:sm%2===0;}if(hit)x+=v*(DBETS[k].p+1);}return x;};
    let res=roll3();if(luckTry(dr(res)<stake))res=roll3();
    st.dice.forEach(d=>d.t=1.1);
    for(let k=0;k<10;k++){dice.innerHTML=[0,1,2].map(()=>pipHTML(1+pick(6))).join('');dice.classList.add('shake');await wait(90);}
    dice.classList.remove('shake');dice.innerHTML=res.map(pipHTML).join('');SFX.clunk();
    st.dice.forEach((d,i)=>setDieTop(d.m,res[i]));
    const sum=res[0]+res[1]+res[2],triple=res[0]===res[1]&&res[1]===res[2];
    let ret=0;
    for(const k in bets){const v=bets[k];let hit=false;
      if(k==='triple')hit=triple;else if(!triple){hit=k==='small'?sum<=10:k==='big'?sum>=11:k==='odd'?sum%2===1:sum%2===0;}
      if(hit)ret+=v*(DBETS[k].p+1);}
    msg.innerHTML=`Total <b>${sum}</b>${triple?' (TRIPLE!)':''}. `+(ret>0?`<b class="win">Menang ${fmt(ret)} koin!</b>`:`<b class="lose">Tidak kena.</b>`);
    if(ret>stake){triple?SFX.big():SFX.win();you.cheer=1.3;}else SFX.lose();
    speak(joko,`${res.join('-')}, total ${sum}. ${triple?'Triple!':sum>=11?'Besar!':'Kecil!'}`,false);
    settle(stake,ret,'Besar Kecil');bets={};modal.busy=false;upd();modal.refresh();
  };
  upd();
}

/* ---------- loop ---------- */
const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(.05,clock.getDelta()),now=performance.now();
  if(started){
    let fx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joyV.x;
    let fz=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0)+joyV.y;
    const s=Math.sin(camYaw),c=Math.cos(camYaw);
    const mx=fx*c+fz*s,mz=-fx*s+fz*c;
    moveEnt(you,modal?0:mx,modal?0:mz,keys['shift'],dt,!modal&&keys[' ']);
    npcs.forEach(n=>npcThink(n,dt));
  }else camYaw+=dt*.12;
  TABLES.forEach(t=>moveEnt(t.hostEnt,0,0,false,dt,false));
  dealers.forEach(d=>moveEnt(d,0,0,false,dt,false));
  marq.forEach(b=>b.m.color.setHex((Math.floor(now/110)+b.i)%4<2?0xfff1b0:0x553a10));
  diceMeshes.forEach(d=>{if(d.t>0){d.t-=dt;d.m.position.y=d.base.y+Math.abs(Math.sin(d.t*9))*.5*d.t;d.m.rotation.x+=dt*12;d.m.rotation.z+=dt*9;if(d.t<=0){d.m.position.copy(d.base);d.m.rotation.set(0,0,0);}}});
  ents.forEach(e=>animate(e,dt,now));
  for(const w of wheels){
    if(w.spin){const s=w.spin,k=Math.min(1,(now-s.t0)/s.dur),e=1-Math.pow(1-k,3);
      w.rot=s.from+(s.to-s.from)*e;w.disc.rotation.z=w.rot;
      const seg=Math.floor((w.rot-Math.PI/2)/SEG);
      if(seg!==s.lastSeg){if(s.lastSeg!==null){const v=volFor(w.center);if(v>.05)SFX.tick(1-k,v);}s.lastSeg=seg;}
      if(k>=1){w.spin=null;s.res();}}
    if(w.show){if(now>w.show.until){w.el.classList.add('off');w.show=null;}else placeEl(w.el,w.center,2.3);}
  }
  for(let i=confetti.length-1;i>=0;i--){const p=confetti[i];p.life-=dt;p.v.y-=12*dt;p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=p.spin*dt;p.m.rotation.y+=p.spin*dt;
    if(p.m.position.y<.05){p.m.position.y=.05;p.v.set(0,0,0);}
    if(p.life<=0){scene.remove(p.m);p.m.geometry.dispose();confetti.splice(i,1);}}
  if(fountainJet){fountainJet.scale.y=1+Math.sin(now/180)*.15;}
  if(podium)podium.rotation.y+=dt*.35;
  if(garage&&isOutside())garage.children.forEach(o=>{if(o.userData.bill)o.lookAt(camera.position.x,o.position.y,camera.position.z);});
  bulbs.forEach(b=>{const on=(Math.floor(now/400)+b.i)%3!==0;b.m.color.setHex(on?b.col:0x2a2040);});
  updateCamera(dt);
  ents.forEach(e=>{const far=e!==you&&e.pos.distanceTo(camera.position)>(e.isHost?30:22);e.tagEl.classList.toggle('off',far);if(!far)placeEl(e.tagEl,e.pos,e.isHost?3.75:3.25);if(now<e.bubbleUntil&&e.pos.distanceTo(camera.position)<34)placeEl(e.bubEl,e.pos,e.isHost?4.2:3.7);else e.bubEl.classList.add('off');});
  const stP=started&&!modal?stationPick():null;
  const nw=started&&!busy&&!modal&&!stP?nearestWheel():null;
  if(stP){prompt.innerHTML=`<b>E</b>${stP.type==='garage'?'Lihat':'Main'} ${stP.label}`;prompt.classList.remove('off');placeEl(prompt,stP.pos,2.6);}
  else if(nw&&!nw.spin){prompt.innerHTML=`<b>E</b>${nw.role==='host'?'Roda milik host':nw.role==='player'?'Main '+nw.table.name:nw.role==='duelP'?(duel&&duel.stage==='wait'?'Mulai duel':'Meja duel'):nw.role==='duelR'?'Roda lawan':'Putar roda'}`;prompt.classList.remove('off');placeEl(prompt,nw.center,1.5);}
  else prompt.classList.add('off');
  updateCtx();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
function boot(){buildWorld();buildCharacters();if(location.hash==='#dev')window.__L={you,wheels,ORDER,stations,showBroke,S,render,DUEL,PF,get duel(){return duel},set duel(v){duel=v},inviteDuel,get modal(){return modal}};camTarget.set(you.pos.x,2.4,you.pos.z);render();requestAnimationFrame(loop);}
const fontsReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('700 40px Fredoka'),document.fonts.load('800 14px Nunito')]):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,1500))]).then(boot,boot);
})();
</script>
